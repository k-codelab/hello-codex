<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <title>Hello World — はじめてのWebページ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #202c25;
      background: #f4f6f1;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(202, 222, 194, .55), transparent 38%),
        radial-gradient(ellipse at 90% 90%, rgba(236, 215, 177, .42), transparent 34%),
        #f4f6f1;
    }

    main {
      width: min(100%, 720px);
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(36px, 8vw, 76px);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(41, 62, 47, .09);
      border-radius: 28px;
      background: rgba(255, 255, 253, .88);
      box-shadow: 0 24px 70px rgba(44, 59, 45, .09), 0 2px 8px rgba(44, 59, 45, .04);
    }

    main::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -80px;
      top: -95px;
      border: 1px solid rgba(88, 125, 91, .16);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(88, 125, 91, .035), 0 0 0 48px rgba(88, 125, 91, .025);
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: #587d5b;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 6.6rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 750;
    }

    h1 span { color: #66896a; }

    .intro {
      max-width: 430px;
      margin: 28px 0 0;
      color: #68736a;
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.9;
      letter-spacing: .025em;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 52px;
      color: #879087;
      font-size: .8rem;
      letter-spacing: .04em;
    }

    .sparkle { color: #c3924e; font-size: 1rem; }

    @media (max-width: 480px) {
      main { min-height: 390px; border-radius: 22px; }
      .footer { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">はじめての一歩</p>
    <h1>Hello<br><span>World!</span></h1>
    <p class="intro">Codexを使った最初のWebページです。<br>ここから、アイデアを形にしていきましょう。</p>
    <div class="footer"><span class="sparkle" aria-hidden="true">✳</span> Your next idea starts here.</div>
  </main>
</body>
</html>
